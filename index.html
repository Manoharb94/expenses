<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mute:#6f6e68;--line:#e4e2da;--acc:#1f6f5c;--out:#b4432f;--in:#1f6f5c;--chip:#ecebe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;margin:20px 0 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:700}.mute{color:var(--mute);font-size:13px}.out{color:var(--out)}.in{color:var(--in)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600}
.btn.s{width:auto;padding:8px 14px}.btn.ghost{background:var(--chip);color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--acc)}
.bar i.over{background:var(--out)}
.tx{padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.tag{display:inline-block;font-size:12px;background:var(--chip);border:0;color:var(--ink);border-radius:6px;padding:3px 8px;font-family:inherit}
.tag.warn{background:#f3d9a8;color:#5a3d00}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 2px;font:inherit;font-size:12px}nav button.on{color:var(--acc);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cats button{padding:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:0 4px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px}.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}.tap{cursor:pointer}
.hide{display:none}.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
</style>
</head>

<main id="app"></main>
<nav id="nav" class="hide"><button data-t="home" class="on">Summary</button><button data-t="rep">Reports</button><button data-t="plan">Plan</button><button data-t="goals">Goals</button><button data-t="me">Settings</button></nav>
<div id="sheet"></div>
<script>
var URLB="https://fwxhclagrwlzxvsmaekt.supabase.co/rest/v1/",KEY="sb_publishable_PiCUzSknFyCfGfEVzTiQbg_qEkBYwL_";

var NOBUD={"Salary / Income":1};NOBUD[TRF]=1;NOBUD[IGN]=1;NOBUD[CCB]=1;NOBUD[LOUT]=1;NOBUD[LIN]=1;NOBUD[UNPL]=1;NOBUD[RENT]=1;
var NOBUDGET={};for(var k in NOBUD)NOBUDGET[k]=1;["Rent / EMI","Education","Home loan EMI","Kid education","Kid day care","Maid","Cook","Car cleaning","Electricity bill","Gas bill","Family donation","Family & Friends"].forEach(function(c){NOBUDGET[c]=1});
var S={tab:"home",range:"month",from:"",to:"",rp:"this",hf:"all",pf:"",txns:[],budgets:[],fixed:[],planErr:"",goals:[],gents:[],lrows:{},goalErr:"",cur:"₹",code:"",name:"",err:"",loaded:false};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return S.cur+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2})}
function pad(n){return String(n).padStart(2,"0")}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function mk(n){return String(n).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"unknown"}
async function api(path,opt){
  opt=opt||{};var h={apikey:KEY,"x-household":S.code,"Content-Type":"application/json"};
  for(var k in (opt.headers||{}))h[k]=opt.headers[k];opt.headers=h;
  var r=await fetch(URLB+path,opt),t=await r.text();
  if(!r.ok)throw new Error(r.status+" "+t);return t?JSON.parse(t):null;
}
async function loadPlan(){
  try{S.budgets=await api("budgets?select=*")||[];S.fixed=await api("fixed_items?select=*&order=created_at.asc")||[];S.planErr=""}
  catch(e){S.planErr="Plan tables are not set up yet ("+e.message.slice(0,80)+")"}
  try{S.goals=await api("goals?select=*&order=created_at.asc")||[];S.goalErr=""}
  catch(e){S.goals=[];S.goalErr="Goals are not set up yet. Run goals.sql in Supabase."}
  try{S.gents=await api("goal_entries?select=*&order=created_at.asc")||[]}catch(e){S.gents=null}
}
async function load(){
  try{S.txns=await api("transactions?select=*&order=txn_date.desc,created_at.desc&limit=3000")||[];S.err="";S.loaded=true}
  catch(e){S.err="Could not load: "+e.message}
  if(S.loaded)await loadPlan();
  if(S.loaded&&!S.pf)S.pf=S.name;
  render();
}
function pdate(off){var n=new Date(),ms=S.ms||1,m=n.getMonth()+off;
  if(n.getDate()<Math.min(ms,new Date(n.getFullYear(),n.getMonth()+1,0).getDate()))m--;
  return new Date(n.getFullYear(),m,Math.min(ms,new Date(n.getFullYear(),m+1,0).getDate()))}
function pend(off){var d=pdate(off+1);d.setDate(d.getDate()-1);return d}
function pkey(ds){if(!ds)return "";var d=new Date(ds+"T00:00:00"),m=d.getMonth();
  if(d.getDate()<Math.min(S.ms||1,new Date(d.getFullYear(),m+1,0).getDate()))m--;return ym(new Date(d.getFullYear(),m,1))}
function plabel(off){var a=pdate(off),b=pend(off),o={day:"numeric",month:"short"};
  return (S.ms||1)===1?a.toLocaleString("en-IN",{month:"long",year:"numeric"}):a.toLocaleString("en-IN",o)+" – "+b.toLocaleString("en-IN",o)+" "+b.getFullYear()}
function preset(r){var n=new Date();S.range=r;
  if(r==="month"){S.from=iso(pdate(0));S.to=iso(n)}
  else if(r==="last"){S.from=iso(pdate(-1));S.to=iso(pend(-1))}
  else if(r==="all"){S.from="";S.to=""}}
function isCount(t){return t.category!==TRF&&t.category!==IGN&&t.category!==CCB&&t.category!==LOUT&&t.category!==LIN}
function personOK(t){return !S.pf||S.pf==="__both"||t.person===S.pf}
function inRange(t){var d=t.txn_date||"";return personOK(t)&&(!S.from||d>=S.from)&&(!S.to||d<=S.to)}
function sum(l,ty){return l.filter(function(t){return t.type===ty}).reduce(function(a,t){return a+Number(t.amount)},0)}
function persons(){var seen={};S.txns.forEach(function(t){if(t.person)seen[t.person]=1});if(S.name)seen[S.name]=1;
  return Object.keys(seen).sort(function(a,b){return a===S.name?-1:b===S.name?1:a<b?-1:1})}
function personUI(){
  var names=persons(),h='<div class="mute">Show expenses of</div><select id="pf">';
  names.forEach(function(n){h+='<option value="'+esc(n)+'"'+(S.pf===n?" selected":"")+'>'+esc(n)+(n===S.name?" (you)":"")+'</option>'});
  if(names.length>1)h+='<option value="__both"'+(S.pf==="__both"?" selected":"")+'>Both of us</option>';
  return h+'</select>';
}
function rangeUI(){
  var o=[["month","This month"],["last","Last month"],["all","All time"],["custom","Custom"]],h=personUI()+'<div class="mute">Period</div><select id="rg">';
  o.forEach(function(x){h+='<option value="'+x[0]+'"'+(S.range===x[0]?" selected":"")+'>'+x[1]+'</option>'});
  return h+'</select><div class="dates"><div><div class="mute">From</div><input type="date" id="df" value="'+S.from+'"></div><div><div class="mute">To</div><input type="date" id="dt" value="'+S.to+'"></div></div>';
}
/* ---------- charts and ideas ---------- */
var PAL=["#1f6f5c","#c9772b","#4b7bb5","#b4432f","#8a6bb1","#d1a52b","#3f9aa8","#a35c7a"];
function colr(n,i){return n===UNC?"#9b9a92":PAL[i%8]}
function pie(by,total){
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),items=[],rest=0;
  ks.forEach(function(k,i){if(i<7)items.push([k,by[k]]);else rest+=by[k]});
  if(rest>0)items.push(["Everything else",rest]);
  var C=2*Math.PI*40,acc=0,svg='<svg viewBox="0 0 120 120" width="170" height="170" role="img" aria-label="Spending by category"><g transform="rotate(-90 60 60)">';
  items.forEach(function(it,i){var len=it[1]/total*C;
    svg+='<circle cx="60" cy="60" r="40" fill="none" stroke="'+colr(it[0],i)+'" stroke-width="22" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'"/>';acc+=len});
  svg+='</g></svg>';
  var lg='<div style="flex:1;min-width:160px">';
  items.forEach(function(it,i){lg+='<div class="row" style="margin:5px 0;font-size:14px"><span><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:'+colr(it[0],i)+';margin-right:7px"></i>'+esc(it[0])+'</span><span><b>'+Math.round(it[1]/total*100)+'%</b> <span class="mute">'+money(it[1])+'</span></span></div>'});
  return '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center">'+svg+lg+'</div></div>';
}
function catTotals(list){var o={};list.forEach(function(t){var c=t.category||UNC;o[c]=(o[c]||0)+Number(t.amount)});return o}
function prevList(){
  if(!S.from||!S.to)return null;
  var a=new Date(S.from+"T00:00:00"),b=new Date(S.to+"T00:00:00"),days=Math.round((b-a)/864e5)+1;
  var ps=new Date(a),pe=new Date(a);ps.setDate(a.getDate()-days);pe.setDate(a.getDate()-1);
  var f=iso(ps),t=iso(pe);return S.txns.filter(function(x){var d=x.txn_date||"";return personOK(x)&&isCount(x)&&d>=f&&d<=t&&x.type==="out"});
}
function insights(Lc,by,total){
  var tips=[],DISC={"Food – Dining out":1,"Food – Online delivery":1,"Shopping – Offline":1,"Shopping – Online":1,"Entertainment":1,"Travel":1};
  var outs=Lc.filter(function(t){return t.type==="out"}),ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  if(!ks.length||total<=0)return tips;
  var top=ks[0];tips.push("<b>"+esc(top)+"</b> is your biggest spend: "+money(by[top])+" ("+Math.round(by[top]/total*100)+"% of the total).");
  var disc=0;ks.forEach(function(k){if(DISC[k])disc+=by[k]});
  if(disc>0)tips.push("Eating out, delivery, shopping, entertainment and travel add up to <b>"+money(disc)+"</b> ("+Math.round(disc/total*100)+"%). These are the easiest to trim. Cutting 10% would save about "+money(disc*0.1)+".");
  var fd=outs.filter(function(t){return t.category==="Food – Online delivery"});
  if(fd.length>=3)tips.push("You placed <b>"+fd.length+" food delivery orders</b> averaging "+money(sum(fd,"out")/fd.length)+" each. Cooking at home a few of those times would add up.");
  var pv=prevList();
  if(pv&&pv.length){var pc=catTotals(pv);
    ks.forEach(function(k){if(k===UNC)return;var was=pc[k]||0,now=by[k];
      if(now-was>=500&&(was===0||now>=was*1.25))tips.push("<b>"+esc(k)+"</b> is up "+(was?Math.round((now-was)/was*100)+"%":"from nothing")+" compared with the previous period ("+money(was)+" to "+money(now)+").")})}
  var cnt={};outs.forEach(function(t){var m=t.merchant||"Unknown";(cnt[m]=cnt[m]||{n:0,s:0}).n++;cnt[m].s+=Number(t.amount)});
  Object.keys(cnt).sort(function(a,b){return cnt[b].s-cnt[a].s}).slice(0,12).some(function(m){var c=cnt[m];
    if(c.n>=5&&c.s/c.n<600){tips.push("<b>"+c.n+" small payments to "+esc(m)+"</b> total "+money(c.s)+". Small amounts that repeat are easy to miss.");return true}return false});
  var nc=by[UNC]||0;
  if(nc>0&&nc/total>0.15)tips.push(Math.round(nc/total*100)+"% of your spending has no category yet ("+money(nc)+"). Choose categories so these ideas become more accurate.");
  return tips.slice(0,6);
}
/* ---------- budgets and fixed items ---------- */
function spentThisMonth(){var key=monthKey(0),o={};
  S.txns.forEach(function(t){if(t.type==="out"&&isCount(t)&&pkey(t.txn_date)===key){var c=t.category||UNC;o[c]=(o[c]||0)+Number(t.amount)}});return o}
function spentByPerson(){var key=monthKey(0),o={};
  S.txns.forEach(function(t){if(t.type==="out"&&isCount(t)&&pkey(t.txn_date)===key){var c=t.category||UNC,p=t.person||"?";o[c]=o[c]||{};o[c][p]=(o[c][p]||0)+Number(t.amount)}});return o}
var PCOL=["#1f6f5c","#c9772b","#4b7bb5","#8a6bb1"];
function pcol(p){var i=persons().slice().sort().indexOf(p);return PCOL[(i<0?0:i)%4]}
function budBar(a,byp){
  var ps=Object.keys(byp||{}).sort(),tot=0;ps.forEach(function(p){tot+=byp[p]});
  var scale=Math.max(a,tot)||1,segs='',lg='';
  ps.forEach(function(p){segs+='<i style="width:'+(byp[p]/scale*100).toFixed(1)+'%;background:'+pcol(p)+'"></i>';
    lg+='<span style="margin-right:12px;white-space:nowrap"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+pcol(p)+';margin-right:5px"></i>'+esc(p)+' '+money(byp[p])+'</span>'});
  return '<div class="bar" style="display:flex;'+(tot>a?'box-shadow:0 0 0 2px var(--out)':'')+'">'+segs+'</div><div class="note">'+(lg||'No spending yet')+'</div>'+
    '<div class="note">'+(tot>a?'<b class="out">Over by '+money(tot-a)+'</b>':'Left '+money(a-tot))+' of '+money(a)+'</div>';
}
function occurs(f,m){
  if(f.freq==="yearly")return Number(f.month||1)===m;
  if(f.freq==="quarterly")return (((m-Number(f.month||1))%3)+3)%3===0;
  return true}
function fixedIn(m){return S.fixed.reduce(function(a,f){return a+(occurs(f,m)?Number(f.amount):0)},0)}
function dueSoon(){
  var out=[],now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  S.fixed.forEach(function(f){for(var i=0;i<2;i++){var m=new Date(t0.getFullYear(),t0.getMonth()+i,1);if(!occurs(f,m.getMonth()+1))continue;
    var dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),d=new Date(m.getFullYear(),m.getMonth(),Math.min(Number(f.day||1),dim));
    var diff=Math.round((d-t0)/864e5);if(diff>=0&&diff<=7)out.push({f:f,d:d,diff:diff})}});
  return out.sort(function(a,b){return a.diff-b.diff})}
/* ---------- forecast ---------- */
function monthStart(off){return pdate(off)}
function monthKey(off){return ym(monthStart(off))}
function txIn(key){return S.txns.filter(function(t){return personOK(t)&&pkey(t.txn_date)===key})}
function fixedCats(){var o={};S.fixed.forEach(function(f){if(f.category)o[f.category]=1});return o}
function monthVar(key,type){var fc=fixedCats();
  return txIn(key).filter(function(t){return t.type===type&&isCount(t)&&(type==="in"||!fc[t.category])}).reduce(function(a,t){return a+Number(t.amount)},0)}
function forecastBase(){
  var now=new Date(),cur=monthKey(0),mine=S.txns.filter(personOK).filter(function(t){return t.txn_date});
  if(!mine.length)return {n:0,out:0,inn:0,basis:"no data yet"};
  var earliest=mine.map(function(t){return pkey(t.txn_date)}).sort()[0];
  if(earliest>=cur){var day=Math.round((new Date(iso(now)+"T00:00:00")-pdate(0))/864e5)+1,dim=Math.round((pdate(1)-pdate(0))/864e5);
    return {n:0,out:monthVar(cur,"out")/day*dim,inn:monthVar(cur,"in")/day*dim,basis:"this month so far, projected to a full month"}}
  var ks=[];for(var i=1;i<=3;i++){var k=monthKey(-i);if(k<earliest)break;ks.push(k)}
  var o=0,n=0;ks.forEach(function(k){o+=monthVar(k,"out");n+=monthVar(k,"in")});
  return {n:ks.length,out:o/ks.length,inn:n/ks.length,basis:"the average of your last "+ks.length+" full month"+(ks.length>1?"s":"")}
}
function forecastView(n){
  var b=forecastBase(),rows=[],tot=0,i;
  for(i=1;i<=n;i++){var d=monthStart(i),v=b.out+fixedIn(d.getMonth()+1);rows.push([d,v]);tot+=v}
  var h='';
  if(!S.fixed.length)h+='<div class="card mute">Add fixed expenses such as your home loan and school fees in the <b>Plan</b> tab for a better forecast.</div>';
  var title=n===1?"Expected spending next month":"Expected spending over the next 12 months";
  h+='<div class="card"><div class="mute">'+title+'</div><div class="big out">'+money(tot)+'</div><div class="note">Everyday spending is based on '+esc(b.basis)+', plus your fixed items. It is an estimate, not a promise.</div></div>';
  var recv=b.inn*n;
  h+='<div class="grid"><div class="card"><div class="mute">Expected money received</div><div style="font-size:20px;font-weight:700" class="in">'+money(recv)+'</div></div><div class="card"><div class="mute">Expected left over</div><div style="font-size:20px;font-weight:700" class="'+(recv-tot>=0?"in":"out")+'">'+money(recv-tot)+'</div></div></div>';
  if(n===1){var fx=fixedIn(monthStart(1).getMonth()+1);
    h+='<div class="card"><div class="row"><span>Everyday spending (average)</span><b>'+money(b.out)+'</b></div><div class="row" style="margin-top:6px"><span>Fixed items due</span><b>'+money(fx)+'</b></div></div>'}
  else{var mx=Math.max.apply(null,rows.map(function(r){return r[1]}))||1;
    h+='<h2>Month by month</h2><div class="card">';
    rows.forEach(function(r){h+='<div style="margin-bottom:8px"><div class="row"><span>'+r[0].toLocaleString("en-IN",{month:"short",year:"2-digit"})+'</span><b>'+money(r[1])+'</b></div><div class="bar"><i style="width:'+Math.round(r[1]/mx*100)+'%"></i></div></div>'});
    h+='</div>'}
  if(tot===0)h+='<div class="card mute">There is not enough data for a forecast yet.</div>';
  return h;
}
/* ---------- views ---------- */
function isCard(t){return t.kind==="card"||t.category===CCB}
function cardSums(L){
  var sp=L.filter(function(t){return t.kind==="card"&&t.type==="out"&&isCount(t)});
  var bank=L.filter(function(t){return t.category===CCB&&t.kind!=="card"&&t.type==="out"});
  var cr=L.filter(function(t){return t.category===CCB&&t.kind==="card"&&t.type==="in"});
  var paid=sum(bank,"out")||sum(cr,"in");
  return {spent:sum(sp,"out"),n:sp.length,paid:paid};
}

function goalCalc(g){

    ml=cur>0?Math.max(0,after):Math.max(0,after)+1;if(dd<nn)ml=0;

function goalPlan(g){

document.getElementById("nav").onclick=function(e){var t=e.target.dataset&&e.target.dataset.t;if(t){S.tab=t;render();if(t==="plan"||t==="goals")loadPlan().then(render)}};
function idle(){return !document.hidden&&S.code&&S.tab!=="plan"&&S.tab!=="goals"&&S.tab!=="me"&&!document.getElementById("sheet").innerHTML}
document.addEventListener("visibilitychange",function(){if(idle())load()});
setInterval(function(){if(idle())load()},30000);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
S.pf=ls("pf")||"";S.name=ls("name")||"";S.code=ls("code")||"";S.cur=ls("cur")||"₹";S.ms=parseInt(ls("ms"),10)||1;
preset("month");if(S.code&&S.name)load();else render();
</script>
