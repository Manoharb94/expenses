<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Nestwise</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<meta name="theme-color" content="#6d28d9">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mute:#6f6e68;--line:#e4e2da;--acc:#1f6f5c;--out:#b4432f;--in:#1f6f5c;--chip:#ecebe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151514;--card:#1f1f1d;--ink:#efeee8;--mute:#9b9a92;--line:#33332f;--acc:#4fb39a;--out:#e8836e;--in:#4fb39a;--chip:#2b2b28;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;margin:20px 0 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:700}.mute{color:var(--mute);font-size:13px}.out{color:var(--out)}.in{color:var(--in)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600}
.btn.s{width:auto;padding:8px 14px}.btn.ghost{background:var(--chip);color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--acc)}
.bar i.over{background:var(--out)}
.tx{padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.tag{display:inline-block;font-size:12px;background:var(--chip);border:0;color:var(--ink);border-radius:6px;padding:3px 8px;font-family:inherit}
.tag.warn{background:#f3d9a8;color:#5a3d00}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 2px;font:inherit;font-size:12px}nav button.on{color:var(--acc);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cats button{padding:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:0 4px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px}.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}.tap{cursor:pointer}
.hide{display:none}.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
:root{--shadow:0 1px 2px rgba(20,20,10,.05),0 6px 18px rgba(20,20,10,.06);--hero1:#1f6f5c;--hero2:#0f4a3d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--hero1:#2d8f77;--hero2:#14463a}}
.card{border-radius:16px;box-shadow:var(--shadow);border-color:transparent}

h2{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:16px;margin:24px 0 10px}h2:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}


.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;background:var(--chip);color:var(--ink)}
.chip.up{background:rgba(180,67,47,.14);color:var(--out)}.chip.down{background:rgba(31,111,92,.16);color:var(--in)}
.ico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--chip);margin-right:9px;font-size:15px;flex:none}
.stack{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--chip);margin-top:6px}.stack i{display:block;height:100%}
.lg{font-size:12px;color:var(--mute);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.cr{margin:0 0 14px}.cr .row b{white-space:nowrap}
nav{box-shadow:0 -6px 20px rgba(0,0,0,.06);border-top:0}nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;margin:0 2px;transition:background .15s}
nav button i{font-style:normal;font-size:19px;line-height:1}nav button.on{background:var(--chip)}
.btn{box-shadow:0 2px 6px color-mix(in srgb,var(--hero2) 30%,transparent)}.btn.ghost{box-shadow:none}
.bar{height:9px;border-radius:5px}

.code{font:700 26px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;background:var(--chip);border-radius:10px;padding:12px;text-align:center;margin:8px 0;user-select:all}
.alink{background:none;border:0;color:var(--acc);font:inherit;padding:8px 0;text-decoration:underline;cursor:pointer}
.amsg{min-height:20px;margin:0 0 10px;font-size:14px;color:#b4432f}.amsg.ok{color:var(--acc)}
.brand{text-align:center;font-size:44px;margin:18px 0 0}.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}
/* ---- polish ---- */
body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

.btn,.tab,nav button,.cats button,.tap{transition:transform .12s ease,background .15s,box-shadow .15s}.btn:active,.tab:active,nav button:active,.cats button:active{transform:scale(.96)}.tap:active{transform:scale(.985)}
.btn:not(.ghost){background:linear-gradient(135deg,var(--hero1),var(--hero2))}
nav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--card) 82%,transparent)}
nav button.on{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.bar i{background:linear-gradient(90deg,var(--hero2),var(--acc));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.ins{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 8px;scroll-snap-type:x proximity}.ins::-webkit-scrollbar{display:none}
.ic{flex:none;min-width:136px;scroll-snap-align:start;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.ic small{display:block;color:var(--mute);font-size:12px}.ic b{display:block;font-size:19px;margin-top:2px;letter-spacing:-.3px}.ic span{font-size:12px;color:var(--mute)}.ic .e{font-size:18px;display:block;margin-bottom:4px}
.pace{height:6px;border-radius:3px;background:var(--chip);margin-top:8px;overflow:hidden}.pace i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--hero2),var(--acc))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- theme choices ---- */
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{--bg:#151514;--card:#1f1f1d;--ink:#efeee8;--mute:#9b9a92;--line:#33332f;--acc:#4fb39a;--out:#e8836e;--in:#4fb39a;--chip:#2b2b28;color-scheme:dark;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--hero1:#2d8f77;--hero2:#14463a}
:root[data-accent=ocean]{--acc:#2563eb;--hero1:#2f6fe0;--hero2:#153e9c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light])[data-accent=ocean]{--acc:#6ea2ff;--hero1:#3b7bea;--hero2:#17326e}}
:root[data-theme=dark][data-accent=ocean]{--acc:#6ea2ff;--hero1:#3b7bea;--hero2:#17326e}
:root[data-accent=violet]{--acc:#7c3aed;--hero1:#8b5cf6;--hero2:#4c1d95}
@media (prefers-color-scheme:dark){:root:not([data-theme=light])[data-accent=violet]{--acc:#a78bfa;--hero1:#7c4ddb;--hero2:#3b1c78}}
:root[data-theme=dark][data-accent=violet]{--acc:#a78bfa;--hero1:#7c4ddb;--hero2:#3b1c78}
:root[data-accent=sunset]{--acc:#d9622b;--hero1:#e8743b;--hero2:#9a3412}
@media (prefers-color-scheme:dark){:root:not([data-theme=light])[data-accent=sunset]{--acc:#f59a6b;--hero1:#db6a30;--hero2:#7c2d12}}
:root[data-theme=dark][data-accent=sunset]{--acc:#f59a6b;--hero1:#db6a30;--hero2:#7c2d12}
:root[data-accent=rose]{--acc:#be3a6a;--hero1:#d1477a;--hero2:#831843}
@media (prefers-color-scheme:dark){:root:not([data-theme=light])[data-accent=rose]{--acc:#f08aae;--hero1:#c23a6d;--hero2:#6b1535}}
:root[data-theme=dark][data-accent=rose]{--acc:#f08aae;--hero1:#c23a6d;--hero2:#6b1535}
:root[data-accent=graphite]{--acc:#334155;--hero1:#475569;--hero2:#0f172a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light])[data-accent=graphite]{--acc:#94a3b8;--hero1:#475569;--hero2:#1e293b}}
:root[data-theme=dark][data-accent=graphite]{--acc:#94a3b8;--hero1:#475569;--hero2:#1e293b}
.look{display:flex;gap:8px;margin:8px 0 14px}.look button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;font-size:13px}.look button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);font-weight:700}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 4px}.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--line);padding:0;position:relative}.sw button.on{box-shadow:0 0 0 2.5px var(--ink)}
.sw button.on:after{content:"✓";color:#fff;font-weight:800;font-size:18px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sw span{display:block;font-size:11px;color:var(--mute);text-align:center;margin-top:4px}.sw div{text-align:center}
/* ---- swipe to delete ---- */
.swp{position:relative;overflow:hidden;border-radius:14px}.swp>.swa{position:absolute;top:0;right:0;bottom:0;width:92px;display:flex;align-items:center;justify-content:center;background:var(--out);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.swp>.swc{position:relative;background:var(--card);touch-action:pan-y;transition:transform .22s ease;will-change:transform}.swp.drag>.swc{transition:none}
.swp>.swa{opacity:0;transition:opacity .15s}.swp.open>.swa,.swp.drag>.swa{opacity:1}
.swp.card0{margin-bottom:12px;box-shadow:var(--shadow)}.swp.card0>.swc>.card{margin:0;box-shadow:none}
.swh{font-size:12px;color:var(--mute);margin:-4px 0 8px}

/* ---- v2 layout ---- */
body{padding-bottom:120px}
.tb{display:flex;align-items:center;gap:8px;margin:-16px -16px 12px;position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 8px}
.tb b{flex:1;font-size:22px;letter-spacing:-.3px}
.tbb{width:42px;height:42px;border:0;border-radius:12px;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.tbb svg{width:24px;height:24px}
.seg2{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin:0 0 14px}.seg2 button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;font-size:14px;padding:9px 6px;border-radius:10px;cursor:pointer}.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.dc{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.dch{display:flex;align-items:center;justify-content:space-between;cursor:pointer}.dch b{font-size:19px}.arr{font-size:22px;color:var(--ink);line-height:1}
.amt{font-size:36px;font-weight:700;letter-spacing:-.8px;margin:10px 0 2px}
.trend{margin-top:14px;border-radius:18px;padding:14px 12px 8px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff}
.tre{text-align:center;opacity:.7;padding:34px 0}
.lt{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.lt:last-child{border:0}
.lt .ico{width:40px;height:40px;font-size:18px;margin:0}
.lt .m{flex:1;min-width:0}.lt .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lt .m span{font-size:12px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-width:0}
.tile .ti{font-size:24px}.tile small{display:block;color:var(--mute);font-size:12px}.tile b{font-size:17px;white-space:nowrap}
.empty{text-align:center;color:var(--mute);padding:14px 0 4px}.empty .ei{font-size:34px;opacity:.6;display:block;margin-bottom:6px}
.obtn{width:100%;border:1px solid var(--line);background:none;color:var(--acc);border-radius:14px;padding:12px;font:inherit;font-weight:600;margin-top:12px;cursor:pointer}
.cc{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;margin-top:16px}
.cc button{border:0;background:none;color:var(--ink);font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.cc button i{font-style:normal;width:60px;height:60px;border-radius:18px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--bg)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;font-size:32px;line-height:1;box-shadow:0 8px 22px color-mix(in srgb,var(--hero2) 50%,transparent);z-index:8;cursor:pointer}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;border-radius:28px;padding:6px;border:1px solid var(--line)}
nav button{padding:8px 2px;gap:3px;border-radius:22px}nav button svg{width:22px;height:22px}
.lh{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;margin:-16px -16px 14px;padding:10px 8px 0;position:sticky;top:0;z-index:6}
.lhm{display:flex;align-items:center;gap:2px}.lhm b{flex:1;text-align:center;font-size:20px}.lhm button{border:0;background:none;color:#fff;width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}.lhm button svg{width:22px;height:22px}.lhm button:disabled{opacity:.3}
.lht{display:flex;margin-top:4px}.lht button{flex:1;border:0;background:none;color:rgba(255,255,255,.65);font:inherit;font-weight:700;font-size:14px;letter-spacing:.05em;padding:12px 0;border-bottom:3px solid transparent;text-transform:uppercase;cursor:pointer}.lht button.on{color:#fff;border-bottom-color:#fff}
.ltot{text-align:center;font-weight:700;margin:2px 0 10px}
.dg{font-size:12px;font-weight:700;color:var(--mute);margin:14px 4px 6px;text-transform:uppercase;letter-spacing:.04em}
.mr{display:flex;align-items:center;gap:14px;padding:14px 4px;border:0;background:none;width:100%;color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}.mr:last-child{border:0}
.mr i{font-style:normal;font-size:22px;width:30px;text-align:center;flex:none}.mr b{display:block;font-weight:600}.mr span span{display:block;font-size:13px;color:var(--mute)}.mr .go{margin-left:auto;color:var(--mute);font-size:22px}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin:22px 4px 8px}
.trk{display:flex;align-items:center;gap:12px}.trk>i{font-style:normal;width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.trk .m{flex:1;min-width:0}.trk .m b{font-size:17px}.trk .m span{display:block;font-size:13px;color:var(--mute)}
.sbtn{border:1px solid var(--acc);background:none;color:var(--acc);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;flex:none}
.wz .dots{display:flex;gap:6px;justify-content:center;margin:8px 0 18px}.wz .dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.wz .dots i.on{width:26px;background:var(--acc)}
.wz h3{font-size:24px;line-height:1.2;margin:0 0 10px;letter-spacing:-.3px}.wz ol{padding-left:20px;margin:8px 0}.wz li{margin:8px 0}
.kv{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:8px 8px 8px 12px;margin:4px 0 8px;font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}.kv span{flex:1;min-width:0}.kv button{flex:none}
.wzn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}.cgrid button{border:0;background:none;color:var(--ink);font:inherit;font-size:11.5px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;text-align:center;min-width:0;word-break:break-word}.cgrid i{font-style:normal;width:54px;height:54px;border-radius:16px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:23px}.cgrid i.ov{box-shadow:0 0 0 2px var(--out)}.cgrid small{color:var(--mute);font-size:11px}
.warnc{display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,#d1a52b 18%,var(--card));cursor:pointer;text-align:left}
.evs{width:auto;margin:0;padding:6px 28px 6px 10px;font-size:13px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.trt{font-size:12px;opacity:.9;text-align:center;margin:-2px 0 8px;min-height:16px}
.balr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--chip);cursor:pointer}.balr small{display:block;font-size:12px;color:var(--mute);font-weight:400}.balr span{font-weight:600}.balr b{font-size:19px;white-space:nowrap}
.tgl{position:relative;display:inline-block;width:50px;height:30px;flex:none}.tgl input{opacity:0;width:0;height:0;position:absolute}.tgl span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .2s;cursor:pointer}.tgl span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}.tgl input:checked+span{background:var(--acc)}.tgl input:checked+span:before{transform:translateX(20px)}
.pill2{font-size:12px;font-weight:600;border-radius:20px;padding:3px 9px;background:var(--chip);color:var(--ink2,var(--mute));white-space:nowrap}
</style>
</head>

function parseHdfc(aoa){

(function(){
  var st=null,moved=false,W=92;
  function start(x,y,t){var w=t.closest&&t.closest(".swp");if(!w||t.closest(".swa")){st=null;return}closeSwipes(w);st={w:w,x:x,y:y,o:w.classList.contains("open"),dx:0,lock:null};moved=false}
  function move(x,y,e){if(!st)return;var dx=x-st.x,dy=y-st.y;
    if(st.lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))st.lock=Math.abs(dx)>Math.abs(dy)?"h":"v";
    if(st.lock!=="h")return;moved=true;st.w.classList.add("drag");if(e.cancelable)e.preventDefault();
    var base=st.o?-W:0,v=Math.max(-W-20,Math.min(0,base+dx));st.dx=v;st.w.querySelector(".swc").style.transform="translateX("+v+"px)"}
  function end(){if(!st)return;var w=st.w;w.classList.remove("drag");
    if(st.lock==="h"){var open=st.dx<-W/2;w.classList.toggle("open",open);w.querySelector(".swc").style.transform=open?"translateX(-"+W+"px)":""}
    st=null}
  document.addEventListener("touchstart",function(e){var t=e.touches[0];start(t.clientX,t.clientY,e.target)},{passive:true});
  document.addEventListener("touchmove",function(e){var t=e.touches[0];move(t.clientX,t.clientY,e)},{passive:false});
  document.addEventListener("touchend",end);document.addEventListener("touchcancel",end);
  document.addEventListener("mousedown",function(e){if(e.button===0)start(e.clientX,e.clientY,e.target)});
  document.addEventListener("mousemove",function(e){if(st&&e.buttons)move(e.clientX,e.clientY,e)});
  document.addEventListener("mouseup",end);
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest(".swa");if(a){e.stopPropagation();doSwipeDelete(a.getAttribute("data-sw"));return}
    if(moved){moved=false;e.stopPropagation();e.preventDefault();return}
    var w=e.target.closest&&e.target.closest(".swp.open");if(w){e.stopPropagation();e.preventDefault();closeSwipes();return}
  },true);
})();
