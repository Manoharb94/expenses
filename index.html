<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mute:#6f6e68;--line:#e4e2da;--acc:#1f6f5c;--out:#b4432f;--in:#1f6f5c;--chip:#ecebe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151514;--card:#1f1f1d;--ink:#efeee8;--mute:#9b9a92;--line:#33332f;--acc:#4fb39a;--out:#e8836e;--in:#4fb39a;--chip:#2b2b28;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;margin:20px 0 8px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:700}.mute{color:var(--mute);font-size:13px}.out{color:var(--out)}.in{color:var(--in)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.pwrap{position:relative}.pwrap input{padding-right:48px}.pwrap .eye{position:absolute;right:2px;top:0;height:calc(100% - 10px);width:44px;background:none;border:0;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.pwrap .eye svg{width:22px;height:22px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600}
.btn.s{width:auto;padding:8px 14px}.btn.ghost{background:var(--chip);color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--acc)}
.bar i.over{background:var(--out)}
.tx{padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.tag{display:inline-block;font-size:12px;background:var(--chip);border:0;color:var(--ink);border-radius:6px;padding:3px 8px;font-family:inherit}
.tag.warn{background:#f3d9a8;color:#5a3d00}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 2px;font:inherit;font-size:12px}nav button.on{color:var(--acc);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cats button{padding:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:0 4px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px}.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}.tap{cursor:pointer}
.hide{display:none}.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
:root{--shadow:0 1px 2px rgba(20,20,10,.05),0 6px 18px rgba(20,20,10,.06);--hero1:#1f6f5c;--hero2:#0f4a3d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--hero1:#2d8f77;--hero2:#14463a}}
.card{border-radius:16px;box-shadow:var(--shadow);border-color:transparent}

h2{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:16px;margin:24px 0 10px}h2:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}


.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;background:var(--chip);color:var(--ink)}
.chip.up{background:rgba(180,67,47,.14);color:var(--out)}.chip.down{background:rgba(31,111,92,.16);color:var(--in)}
.ico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--chip);margin-right:9px;font-size:15px;flex:none}
.stack{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--chip);margin-top:6px}.stack i{display:block;height:100%}
.lg{font-size:12px;color:var(--mute);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.cr{margin:0 0 14px}.cr .row b{white-space:nowrap}
nav{box-shadow:0 -6px 20px rgba(0,0,0,.06);border-top:0}nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;margin:0 2px;transition:background .15s}
nav button i{font-style:normal;font-size:19px;line-height:1}nav button.on{background:var(--chip)}
.btn{box-shadow:0 2px 6px color-mix(in srgb,var(--hero2) 30%,transparent)}.btn.ghost{box-shadow:none}
.bar{height:9px;border-radius:5px}

.code{font:700 26px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;background:var(--chip);border-radius:10px;padding:12px;text-align:center;margin:8px 0;user-select:all}
.alink{background:none;border:0;color:var(--acc);font:inherit;padding:8px 0;text-decoration:underline;cursor:pointer}
.amsg{min-height:20px;margin:0 0 10px;font-size:14px;color:#b4432f}.amsg.ok{color:var(--acc)}
.brand{text-align:center;font-size:44px;margin:18px 0 0}.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}
/* ---- polish ---- */
body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

.btn,.tab,nav button,.cats button,.tap{transition:transform .12s ease,background .15s,box-shadow .15s}.btn:active,.tab:active,nav button:active,.cats button:active{transform:scale(.96)}
.cats.pk{grid-template-columns:repeat(4,1fr);gap:14px 6px}
.cats.pk button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;line-height:1.25;text-align:center;min-width:0;word-break:break-word}
.cats.pk button i{font-style:normal;width:54px;height:54px;border-radius:16px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:23px}
.cats.pk button.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;font-size:inherit;padding:13px;border:1px solid var(--line);background:var(--bg);border-radius:10px;text-align:center}.tap:active{transform:scale(.985)}
.btn:not(.ghost){background:linear-gradient(135deg,var(--hero1),var(--hero2))}
nav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--card) 82%,transparent)}
nav button.on{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.bar i{background:linear-gradient(90deg,var(--hero2),var(--acc));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.ins{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 8px;scroll-snap-type:x proximity}.ins::-webkit-scrollbar{display:none}
.ic{flex:none;min-width:136px;scroll-snap-align:start;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.ic small{display:block;color:var(--mute);font-size:12px}.ic b{display:block;font-size:19px;margin-top:2px;letter-spacing:-.3px}.ic span{font-size:12px;color:var(--mute)}.ic .e{font-size:18px;display:block;margin-bottom:4px}
.pace{height:6px;border-radius:3px;background:var(--chip);margin-top:8px;overflow:hidden}.pace i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--hero2),var(--acc))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root[data-theme=dark]{--bg:#151514;--card:#1f1f1d;--ink:#efeee8;--mute:#9b9a92;--line:#33332f;--acc:#4fb39a;--out:#e8836e;--in:#4fb39a;--chip:#2b2b28;color-scheme:dark;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--hero1:#2d8f77;--hero2:#14463a}
:root[data-accent=ocean]{--acc:#2563eb;--hero1:#2f6fe0;--hero2:#153e9c}

:root[data-accent=violet]{--acc:#7c3aed;--hero1:#8b5cf6;--hero2:#4c1d95}

:root[data-theme=dark][data-accent=violet]{--acc:#a78bfa;--hero1:#7c4ddb;--hero2:#3b1c78}

:root[data-theme=dark][data-accent=sunset]{--acc:#f59a6b;--hero1:#db6a30;--hero2:#7c2d12}

:root[data-theme=dark][data-accent=rose]{--acc:#f08aae;--hero1:#c23a6d;--hero2:#6b1535}
:root[data-accent=graphite]{--acc:#334155;--hero1:#475569;--hero2:#0f172a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light])[data-accent=graphite]{--acc:#94a3b8;--hero1:#475569;--hero2:#1e293b}}

.look{display:flex;gap:8px;margin:8px 0 14px}.look button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;font-size:13px}.look button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);font-weight:700}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 4px}.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--line);padding:0;position:relative}.sw button.on{box-shadow:0 0 0 2.5px var(--ink)}
.sw button.on:after{content:"✓";color:#fff;font-weight:800;font-size:18px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sw span{display:block;font-size:11px;color:var(--mute);text-align:center;margin-top:4px}.sw div{text-align:center}
/* ---- first-time tour ---- */
#tour{position:fixed;inset:0;z-index:9000}#tour .tb0{position:absolute;inset:0}#tour .th{position:fixed;border-radius:20px;box-shadow:0 0 0 100vmax rgba(20,10,45,.66),0 0 0 3px rgba(255,255,255,.85);pointer-events:none;transition:all .25s}
#tour .tc{position:fixed;left:16px;right:16px;bottom:118px;background:var(--card);color:var(--ink);border-radius:20px;padding:16px;box-shadow:0 12px 34px rgba(0,0,0,.35)}#tour .tc.tp{bottom:auto;top:76px}

#tour .tsk{background:none;color:var(--mute);min-width:44px;padding:8px 0;text-align:left;font-size:14px}#tour .tbk{background:none;color:var(--acc);font-weight:600;padding:8px 10px;font-size:14px}
#tour .tnx{background:var(--acc);color:#fff;font-weight:700;padding:9px 20px;border-radius:12px;font-size:14px}#tour .tr{display:flex;align-items:center}
#tour .tds{display:flex;gap:5px}#tour .td{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}#tour .td.on{background:var(--acc);width:18px;border-radius:5px}
/* ---- press and hold to delete (no swipe) ---- */
.swp>.swa{display:none!important}.swp,[data-lp]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.swp input,.swp textarea{-webkit-user-select:text;user-select:text}.bl{width:62%;height:62%;object-fit:contain;border-radius:6px}.dn-i .bl{width:60%;height:60%}
.swp{position:relative;overflow:hidden;border-radius:14px}.swp>.swa{position:absolute;top:0;right:0;bottom:0;width:92px;display:flex;align-items:center;justify-content:center;background:var(--out);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.swp>.swc{position:relative;background:var(--card);touch-action:pan-y;transition:transform .22s ease;will-change:transform}.swp.drag>.swc{transition:none}
.swp>.swa{opacity:0;transition:opacity .15s}.swp.open>.swa,.swp.drag>.swa{opacity:1}
.swp.card0{margin-bottom:12px;box-shadow:var(--shadow)}.swp.card0>.swc>.card{margin:0;box-shadow:none}
.swh{font-size:12px;color:var(--mute);margin:-4px 0 8px}

/* ---- v2 layout ---- */

nav{overflow:visible}nav button.navadd{flex:0 0 58px;width:58px;height:58px;margin:-24px 4px 0;padding:0;border-radius:50%;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center;gap:0;box-shadow:0 8px 22px color-mix(in srgb,var(--hero2) 50%,transparent),0 0 0 4px var(--bg);cursor:pointer}

nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;border-radius:28px;padding:6px;border:1px solid var(--line)}

var SC_TPL="/* Gharwise: reads your own bank alert emails and sends the payments to the app.\n   Made for __NAME__. Keep this private: it contains your personal key.\n   1. Press Save (disk icon).  2. In the function box choose  setup  and press Run.\n   3. Allow access when Google asks (Advanced > Go to project). That is all. */\nvar API_ = \"https://fwxhclagrwlzxvsmaekt.supabase.co/rest/v1/rpc/\";\nvar ANON_ = \"sb_publishable_PiCUzSknFyCfGfEVzTiQbg_qEkBYwL_\";\nvar USER_KEY = \"__KEY__\";\nvar MONEY_ = /(?:rs\\.?|inr|₹)\\s?[0-9]/i;\nvar WORDS_ = /(debit|credit|transaction|transfer|deposit|withdraw|spent|paid|received|sent|upi|neft|imps|rtgs)/i;\nvar ACCT_ = /(a\\/c|acct|account|card|upi|vpa)/i;\nvar PERSONAL_ = /@(gmail|googlemail|yahoo|outlook|hotmail|icloud|rediffmail)\\./i;\n\nfunction call_(fn, payload) {\n  var r = UrlFetchApp.fetch(API_ + fn, { method: \"post\", contentType: \"application/json\",\n    headers: { apikey: ANON_ }, payload: JSON.stringify(payload), muteHttpExceptions: true });\n  if (r.getResponseCode() >= 300) throw new Error(fn + \" replied \" + r.getResponseCode() + \" \" + r.getContentText());\n  return JSON.parse(r.getContentText());\n}\nfunction clip_(b) {\n  b = b.replace(/https?:\\/\\/\\S+/g, \" \").replace(/\\s+/g, \" \");\n  var i = b.search(/(?:Rs\\.?|INR|₹)\\s?[0-9]/i);\n  if (i > 300) b = b.substring(i - 300);\n  return b.substring(0, 2000);\n}\nfunction addr_(from) {\n  var m = String(from).match(/<([^>]+)>/);\n  return (m ? m[1] : String(from)).trim().toLowerCase();\n}\nfunction sync_(days, stopAt, fresh) {\n  var cfg = call_(\"script_config\", { p_key: USER_KEY });\n  var known = {}; cfg.senders.forEach(function (s) { known[s] = 1; });\n  var base = \" newer_than:\" + days + \"d\";\n  var queries = [];\n  for (var g = 0; g < cfg.senders.length; g += 20) queries.push(\"from:(\" + cfg.senders.slice(g, g + 20).join(\" OR \") + \")\" + base);\n  queries.push(\"(bank OR debited OR credited OR transaction OR transfer OR deposit OR withdrawn OR UPI OR NEFT OR IMPS OR RTGS) -category:promotions -category:social\" + base);\n  var props = PropertiesService.getScriptProperties();\n  var last = fresh ? 0 : Number(props.getProperty(\"last\") || 0);\n  var cutoff = last ? last - 3 * 3600 * 1000 : 0;\n  var saved = 0, skipped = 0, seen = 0, newest = last, allDone = true, ids = {}, found = [];\n  for (var qi = 0; qi < queries.length; qi++) {\n    var start = 0, done = false;\n    while (Date.now() < stopAt) {\n      var threads = GmailApp.search(queries[qi], start, 25);\n      if (!threads.length) { done = true; break; }\n      start += threads.length;\n      var raws = [];\n      threads.forEach(function (t) { t.getMessages().forEach(function (m) {\n        var ts = m.getDate().getTime();\n        if (ts <= cutoff) return;\n        var id = m.getId(); if (ids[id]) return; ids[id] = 1;\n        if (ts > newest) newest = ts;\n        var from = m.getFrom(), a = addr_(from), body = m.getPlainBody() || \"\", text = (m.getSubject() || \"\") + \" \" + body;\n        if (!MONEY_.test(text) || !WORDS_.test(text)) return;\n        if (/\\botp\\b|one[ -]time password/i.test(text) && !/debited|credited/i.test(text)) return;\n        var isKnown = !!known[a], bankName = /bank/i.test(from) || /bank/i.test(a);\n        var strong = bankName || (/debited|credited/i.test(text) && ACCT_.test(text));\n        if (!isKnown && !strong) return;\n        raws.push(clip_(body)); seen++;\n        if (!isKnown && strong && !PERSONAL_.test(a) && found.indexOf(a) < 0) found.push(a);\n      }); });\n      for (var i = 0; i < raws.length; i += 80) { var r = call_(\"ingest_user\", { p_key: USER_KEY, p_raws: raws.slice(i, i + 80) }); saved += r.saved; skipped += r.skipped; }\n    }\n    if (!done) { allDone = false; break; }\n  }\n  if (found.length) { try { call_(\"save_senders\", { p_key: USER_KEY, p_senders: found.slice(0, 50) }); } catch (e) { Logger.log(\"Could not save senders: \" + e); } }\n  if (allDone && newest > last) props.setProperty(\"last\", String(newest));\n  Logger.log(\"Checked \" + seen + \" bank emails: \" + saved + \" new, \" + skipped + \" already there or not a payment.\");\n  return saved;\n}\nfunction run() { sync_(2, Date.now() + 240000, false); }\nfunction setup() {\n  ScriptApp.getProjectTriggers().forEach(function (t) { ScriptApp.deleteTrigger(t); });\n  ScriptApp.newTrigger(\"run\").timeBased().everyMinutes(5).create();\n  var n = sync_(60, Date.now() + 270000, true);\n  Logger.log(\"Connected. Saved \" + n + \" payments so far. New alerts are checked every 5 minutes.\");\n}\n";

function splitSheet(t){

  function tot(){var x=0;st.blocks.forEach(function(b){b.rows.forEach(function(r){x+=parseFloat(r.a)||0})});return Math.round(x*100)/100}

(function(){

    var el=t.closest("[data-lp],.swp");if(!el)return;

  function move(x,y){if(tm&&(Math.abs(x-sx)>10||Math.abs(y-sy)>10))clear()}
  document.addEventListener("touchstart",function(e){var t=e.touches[0];start(t.clientX,t.clientY,e.target)},{passive:true});
  document.addEventListener("touchmove",function(e){var t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
  document.addEventListener("touchend",clear);document.addEventListener("touchcancel",clear);
  document.addEventListener("mousedown",function(e){if(e.button===0)start(e.clientX,e.clientY,e.target)});
  document.addEventListener("mousemove",function(e){if(tm)move(e.clientX,e.clientY)});
  document.addEventListener("mouseup",clear);
  document.addEventListener("contextmenu",function(e){var t=e.target;if(t&&t.closest&&t.closest("[data-lp],.swp")&&!t.closest("input,select,textarea"))e.preventDefault()});

})();
