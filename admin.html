<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Gharwise</title>
<style>
:root{color-scheme:light;--bg:#f4f4f1;--surface:#fcfcfb;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--mute:#7a7974;--line:#e4e2da;--grid:#ecebe6;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--good:#1f8a4c;--warn:#b26b00;--bad:#c2372f;--acc:#6250d6;--shadow:0 1px 2px rgba(20,20,10,.05),0 6px 18px rgba(20,20,10,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#121211;--surface:#1a1a19;--card:#1d1d1c;--ink:#f0efec;--ink2:#c3c2b7;--mute:#8f8e86;--line:#2f2f2c;--grid:#2a2a27;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--good:#4cc27e;--warn:#e0a03a;--bad:#ef6b62;--acc:#9085e9;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
header h1{font-size:22px;margin:0;flex:1;letter-spacing:-.3px}header h1 span{color:var(--mute);font-weight:500}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.mute{color:var(--mute);font-size:13px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:26px 2px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.k{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.k small{display:block;color:var(--mute);font-size:12.5px}.k b{display:block;font-size:26px;letter-spacing:-.5px;margin-top:2px}.k span{font-size:12.5px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:16px}.card .sub{color:var(--mute);font-size:12.5px;margin-bottom:10px}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;white-space:nowrap;display:none;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tt i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hb{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr auto;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}
.hb .tr{height:12px;border-radius:4px;background:var(--grid);overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
.hb b{min-width:70px;text-align:right}
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface);margin:8px 0}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600}.st:before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.ok{color:var(--good)}.wa{color:var(--warn)}.ba{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbar input,.tbar select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
.tbar input{flex:1;min-width:180px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;color:var(--ink2);padding:8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th.s:after{content:" ▾"}th.s.up:after{content:" ▴"}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.n,th.n{text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 8px;background:var(--grid);color:var(--ink2)}
.pill.d{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}.pill.w{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
.pill.x{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.score{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--grid);vertical-align:middle;margin-right:6px;overflow:hidden}.score i{display:block;height:100%;background:var(--s1)}
.login{max-width:380px;margin:12vh auto 0}.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin:4px 0 12px}
.login .btn{width:100%;padding:12px}.err{color:var(--bad);min-height:22px;margin-bottom:6px}
.btn.dl{padding:4px 10px;font-size:12px;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.fn{display:grid;grid-template-columns:minmax(150px,1.4fr) 3fr 90px;align-items:center;gap:10px;margin:9px 0;font-size:13.5px}
.fn .tr{height:14px;border-radius:5px;background:var(--grid);overflow:hidden}.fn .tr i{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--s1)}
.fn b{text-align:right}.fn span.m{color:var(--mute);font-weight:400}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 8px;background:var(--grid);color:var(--mute)}.chip.on{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
</style></head><body><main id="app"></main>
<script>
var BASE="https://fwxhclagrwlzxvsmaekt.supabase.co",KEY="sb_publishable_PiCUzSknFyCfGfEVzTiQbg_qEkBYwL_";
var A={tok:null,d:null,q:"",seg:"all",sort:"last_seen",dir:-1};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(v){return Number(v||0).toLocaleString("en-IN")}
function pct(a,b){return b>0?Math.round(a/b*100)+"%":"—"}
function ago(ts){if(!ts)return "never";var m=Math.round((Date.now()-new Date(ts))/60000);if(m<1)return "just now";if(m<60)return m+" min ago";var h=Math.round(m/60);if(h<24)return h+" h ago";var d=Math.round(h/24);return d+" day"+(d>1?"s":"")+" ago"}
function dt(ts){return ts?new Date(ts).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"—"}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
var DAY=864e5;

/* ---------- login ---------- */
function loginView(msg){
  $("app").innerHTML='<div class="login card"><h1 style="margin:0 0 4px">Admin</h1><div class="mute" style="margin-bottom:16px">Gharwise · only admin accounts can open this page</div><label class="mute">Email</label><input id="em" type="email" autocomplete="email"><label class="mute">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="er">'+esc(msg||"")+'</div><button class="btn p" id="go">Log in</button></div>';
  var go=async function(){var b=$("go");b.disabled=true;b.textContent="Logging in…";
    try{var r=await fetch(BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});
      var o=await r.json().catch(function(){return {}});if(!r.ok||!o.access_token)throw new Error(r.status===400?"Wrong email or password.":"Could not log in.");
      A.tok=o.access_token;ss("adm",A.tok);await fetchData()}catch(e){$("er").textContent=e.message;b.disabled=false;b.textContent="Log in"}};
  $("go").onclick=go;$("pw").onkeydown=function(e){if(e.key==="Enter")go()}}
async function fetchData(){
  var r=await fetch(BASE+"/rest/v1/rpc/admin_local_stats",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+A.tok,"Content-Type":"application/json"},body:"{}"});
  var t=await r.text();
  if(r.status===401){ss("adm",null);A.tok=null;return loginView("Session expired. Log in again.")}
  if(!r.ok){ss("adm",null);A.tok=null;return loginView(/not allowed/.test(t)?"This account is not an admin.":/admin_local_stats/.test(t)?"Run local_mode.sql in Supabase first.":"Error "+r.status+": "+t.slice(0,140))}
  A.d=JSON.parse(t);render()}

/* ---------- pieces ---------- */
function tile(lbl,val,sub){return '<div class="k"><small>'+lbl+'</small><b>'+val+'</b>'+(sub?'<span>'+sub+'</span>':'')+'</div>'}
function bars(rows,total){var mx=Math.max.apply(null,rows.map(function(r){return r[1]}).concat([1]));
  return rows.map(function(r){return '<div class="hb"><span>'+esc(r[0])+'</span><div class="tr"><i style="width:'+(r[1]/mx*100).toFixed(1)+'%;'+(r[2]?'background:'+r[2]:'')+'"></i></div><b>'+n(r[1])+(total?' <span class="mute">'+pct(r[1],total)+'</span>':'')+'</b></div>'}).join("")}
function funnel(rows,base){return rows.map(function(r,i){return '<div class="fn"><span>'+esc(r[0])+'</span><div class="tr"><i style="width:'+(base?Math.min(100,r[1]/base*100):0).toFixed(1)+'%"></i></div><b>'+n(r[1])+' <span class="m">'+pct(r[1],base)+'</span></b></div>'}).join("")}
/* where each person is in the setup */
function isDormant(u){return !u.last_seen||Date.now()-new Date(u.last_seen)>14*DAY}
function notSetUp(u){return !u.sms&&!u.guide_sms&&!u.guide_voice&&!u.voice&&!u.budget_set&&!u.email}
var SEGS=[["all","Everyone",function(){return true}],
  ["new","New · 7 days",function(u){return u.first_seen&&Date.now()-new Date(u.first_seen)<7*DAY}],
  ["notset","Not set up yet",notSetUp],
  ["nosms","No SMS tracking",function(u){return !u.sms}],
  ["novoice","No voice yet",function(u){return !u.voice&&!(u.voice_count>0)}],
  ["nobudget","No budget",function(u){return !u.budget_set}],
  ["active","Active · 7 days",function(u){return u.last_seen&&Date.now()-new Date(u.last_seen)<7*DAY}],
  ["dormant","Not opened · 14 days",isDormant]];

/* ---------- page ---------- */
function render(){
  var d=A.d,u=d.users||0,L=d.list||[],S1=css("--s1"),S2=css("--s2"),S3=css("--s3");
  var x='<header><h1>Gharwise <span>· Admin</span></h1><span class="mute">Updated '+new Date(d.generated_at).toLocaleString("en-IN",{hour:"numeric",minute:"2-digit",day:"numeric",month:"short"})+'</span><button class="btn" id="rf">Refresh</button><button class="btn" id="lo">Log out</button></header>';
  x+='<div class="mute" style="margin:-8px 2px 14px">The on-phone app. Payments stay on people’s phones, so this page shows who uses what, never amounts or payees.</div>';
  // people
  x+='<h2>People</h2><div class="kpis">'+tile("Users",n(u),"+"+n(d.new_7d)+" this week · +"+n(d.new_30d)+" in 30 days")+tile("New today",n(d.new_1d))+tile("Active today",n(d.active_1d),pct(d.active_1d,u))+tile("Active · 7 days",n(d.active_7d),pct(d.active_7d,u))+tile("Active · 30 days",n(d.active_30d),pct(d.active_30d,u))+tile("App opens",n(d.opens),"in total")+tile("Payments saved",n(d.payments),"counted on phones")+'</div>';
  // setup flow
  var fn=[["Joined",u],["SMS shortcut added",d.sms_shortcut],["SMS steps finished",d.guide_sms],["SMS tracking live",d.sms_on],["Voice shortcut added",d.voice_shortcut],["Voice steps finished",d.guide_voice],["Voice used · 30 days",d.voice_on],["First budget set",d.budget_set]];
  x+='<h2>Setup flow</h2><div class="grid2"><div class="card"><h3>From joining to set up</h3><div class="sub">Same order as the “Finish setting up” card and the guided steps</div>'+funnel(fn,u)+'</div>'+
     '<div class="card"><h3>Not finished</h3><div class="sub">People who stopped part-way</div>'+
     '<div class="row"><span>Added the SMS shortcut, no SMS tracking yet</span><b>'+n(L.filter(function(r){return r.sms_shortcut&&!r.sms}).length)+'</b></div>'+
     '<div class="row"><span>Added the Voice shortcut, never used voice</span><b>'+n(L.filter(function(r){return r.voice_shortcut&&!r.voice&&!(r.voice_count>0)}).length)+'</b></div>'+
     '<div class="row"><span>Joined, nothing set up</span><b>'+n(L.filter(notSetUp).length)+'</b></div>'+
     '<div class="row"><span>Not opened for 14 days</span><b>'+n(L.filter(isDormant).length)+'</b></div></div></div>';
  // features
  x+='<h2>Features</h2><div class="kpis">'+tile("SMS tracking on",n(d.sms_on),pct(d.sms_on,u))+tile("Email tracking on",n(d.email_on),pct(d.email_on,u))+tile("Used Import SMS",n(d.import_sms),pct(d.import_sms,u))+tile("Voice expenses",n(d.voice_expenses),n(d.voice_on)+" people · 30 days")+tile("Widget mic",n(d.widget_expenses),"expenses by widget")+tile("In a family",n(d.family_on),n(d.families)+(d.families==1?" family":" families"))+tile("In a group",n(d.in_group),n(d.groups)+(d.groups==1?" group":" groups"))+tile("App lock on",n(d.lock_on),pct(d.lock_on,u))+tile("Reminders on",n(d.reminders_on),pct(d.reminders_on,u))+'</div>';
  // devices
  var pl=d.platforms||{},ver=d.versions||{},plRows=[["iPhone",pl.ios||0,S1],["Android",pl.android||0,S2]].concat(Object.keys(pl).filter(function(k){return k!=="ios"&&k!=="android"}).map(function(k){return [k,pl[k],S3]})),
      vr=Object.keys(ver).map(function(k){return [k==="unknown"||!k?"Unknown":k,ver[k]]}).sort(function(a,b){return b[1]-a[1]});
  x+='<div class="grid2" style="margin-top:14px"><div class="card"><h3>Phones</h3><div class="sub">Last device each person opened the app on</div>'+bars(plRows,u)+'</div><div class="card"><h3>App versions</h3><div class="sub">Who still needs to update</div>'+(vr.length?bars(vr,u):'<div class="mute">No data yet.</div>')+'</div></div>';
  // people table
  x+='<h2>People ('+L.length+')</h2><div class="card"><div class="seg" id="sg">'+SEGS.map(function(s){return '<button data-s="'+s[0]+'" class="'+(A.seg===s[0]?'on':'')+'">'+s[1]+' <span style="opacity:.7">'+L.filter(s[2]).length+'</span></button>'}).join('')+'</div>'+
     '<div class="tbar" style="margin-top:10px"><input id="q" type="search" placeholder="Search mobile number" value="'+esc(A.q)+'"><span class="mute" id="cnt"></span></div><div class="tw" id="ut"></div></div>';
  $("app").innerHTML=x;
  $("rf").onclick=async function(){this.textContent="Refreshing…";await fetchData()};
  $("lo").onclick=function(){ss("adm",null);A.tok=null;loginView()};
  $("q").oninput=function(){A.q=this.value;userTable()};
  $("sg").querySelectorAll("button").forEach(function(b){b.onclick=function(){A.seg=b.dataset.s;$("sg").querySelectorAll("button").forEach(function(c){c.classList.toggle("on",c===b)});userTable()}});
  userTable()}
var COLS=[["phone","Mobile"],["first_seen","Joined"],["last_seen","Last opened"],["opens","Opens",1],["platform","Phone"],["version","Version"],["setup","Setup"],["voice_count","Voice",1],["family_size","Family",1],["groups","Groups",1],["payments","Payments",1]];
function userTable(){
  var q=A.q.replace(/\D/g,""),f=(SEGS.filter(function(s){return s[0]===A.seg})[0]||SEGS[0])[2];
  var U=(A.d.list||[]).filter(function(r){return f(r)&&(!q||String(r.phone||"").indexOf(q)>=0)});
  U.sort(function(a,b){var x=a[A.sort],y=b[A.sort];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*A.dir});
  var chip=function(on,t){return '<span class="chip'+(on?' on':'')+'">'+t+'</span>'};
  var h='<table style="min-width:980px"><thead><tr>'+COLS.map(function(c){return '<th data-k="'+c[0]+'" class="'+(c[2]?'n ':'')+(A.sort===c[0]?'s'+(A.dir>0?' up':''):'')+'"'+(c[0]==="setup"?' style="cursor:default"':'')+'>'+c[1]+'</th>'}).join('')+'</tr></thead><tbody>';
  if(!U.length)h+='<tr><td colspan="'+COLS.length+'" class="empty">No one matches</td></tr>';
  U.forEach(function(r){h+='<tr><td><b>'+esc(r.phone?"+"+String(r.phone).replace(/^\+/,""):"—")+'</b></td><td>'+dt(r.first_seen)+'</td><td>'+esc(ago(r.last_seen))+'</td><td class="n">'+n(r.opens)+'</td><td>'+({ios:"iPhone",android:"Android"}[r.platform]||esc(r.platform||"—"))+'</td><td>'+esc(r.version||"—")+'</td>'+
    '<td><div class="chips">'+chip(r.sms,"SMS")+chip(r.email,"Email")+chip(r.voice||r.voice_count>0,"Voice")+chip(r.budget_set,"Budget")+chip(r.import_sms,"Import")+chip(r.lock,"Lock")+'</div></td>'+
    '<td class="n">'+n(r.voice_count)+'</td><td class="n">'+(r.family?n(r.family_size||1):"—")+'</td><td class="n">'+(r.groups?n(r.groups):"—")+'</td><td class="n">'+n(r.payments)+'</td></tr>'});
  $("ut").innerHTML=h+'</tbody></table>';$("cnt").textContent=U.length+" shown";
  $("ut").querySelectorAll("th").forEach(function(th){th.onclick=function(){var k=th.dataset.k;if(k==="setup")return;if(A.sort===k)A.dir=-A.dir;else{A.sort=k;A.dir=(["phone","platform","version"].indexOf(k)>=0)?1:-1}userTable()}})}

A.tok=ss("adm");if(A.tok)fetchData().catch(function(){loginView()});else loginView();
</script></body></html>
